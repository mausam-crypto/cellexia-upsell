# Shopify app configuration.
# After creating the app in the Partner Dashboard, run:
#   shopify app config link
# The CLI will fill in client_id and keep application_url in sync during dev.

client_id = "501bb278be617245331c30293fe921dc"
name = "Cellexia Post-Purchase Upsell"
handle = "cellexia-post-purchase-upsell"
application_url = "https://cellexia-upsell.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_products,read_orders,read_inventory,read_locales,read_markets,write_discounts"

[auth]
redirect_urls = [
  "https://cellexia-upsell.onrender.com/auth/callback",
  "https://cellexia-upsell.onrender.com/auth/shopify/callback",
  "https://cellexia-upsell.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2026-01"

[[webhooks.subscriptions]]
topics = ["app/uninstalled", "app/scopes_update"]
uri = "/webhooks"

[[webhooks.subscriptions]]
topics = ["orders/create", "orders/updated", "products/create", "products/update", "products/delete"]
uri = "/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks"

[pos]
embedded = false
